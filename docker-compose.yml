name: phd-prep

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phd_prep
    ports:
      # Host port 5433: 5432 is used by another local project.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phd_prep"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
